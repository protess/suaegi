[profile.ci]
fail-fast = false
global-timeout = "90m"
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
status-level = "slow"
final-status-level = "flaky"

# Darwin openpty(3) races across processes. The terminal and app crates both
# contain PTY-opening tests, so one shared group serializes them against each
# other while the rest of the workspace remains parallel.
[test-groups]
darwin-pty = { max-threads = 1 }

[[profile.ci.overrides]]
filter = "package(suaegi-term)"
platform = 'cfg(target_os = "macos")'
test-group = "darwin-pty"

[[profile.ci.overrides]]
filter = "package(suaegi-app)"
platform = 'cfg(target_os = "macos")'
test-group = "darwin-pty"
