[package]
name = "suaegi-misc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Why: leaf crate — a batch of eighteen small, self-contained pure helpers ported
# verbatim from Orca's `src/shared/*`. Baselines differ per module: the original
# sixteen are @ v1.4.150-rc.0, and terminal_line_height / ui_language are @
# v1.4.146-rc.0. None of them import anything (no clock, no fs, no base64, no
# hashing): they are pure string/number transforms whose Vitest oracles port
# bit-for-bit. Kept dependency-free (not even serde) so every quirk stays
# mutation-verifiable in isolation and the crate never sits behind another
# suaegi crate. suaegi-fuzzy / suaegi-taskquery precedent.
[dependencies]
