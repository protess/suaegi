[package]
name = "suaegi-misc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Why: leaf crate — a batch of twenty-nine small, self-contained pure helpers
# ported verbatim from Orca's `src/shared/*`. Baselines differ per module: the
# original sixteen are @ v1.4.150-rc.0, and terminal_line_height / ui_language /
# opencode_terminal_title / agent_title_decoration / pi_overlay_ui_settings /
# hosted_review_refs / base_ref_search_result / worktree_base_ref /
# worktree_submodule_removal / ephemeral_setup_terminal_worktree_id /
# github_work_items_query_bounds / github_project_ref_input / gitlab_projects
# are @ v1.4.146-rc.0. None of them import anything (no clock, no fs, no base64, no
# hashing): they are pure string/number/value-tree transforms whose Vitest
# oracles port bit-for-bit. Kept dependency-free (not even serde, and
# pi_overlay_ui_settings deliberately avoids serde_json::Value because its
# BTreeMap-backed Object re-sorts keys) so every quirk stays mutation-verifiable
# in isolation and the crate never sits behind another suaegi crate.
# suaegi-fuzzy / suaegi-taskquery precedent.
[dependencies]
